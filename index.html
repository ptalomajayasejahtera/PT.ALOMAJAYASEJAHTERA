<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PT Aloma Jaya Sejahtera | Produsen Baterai Berkualitas</title>
<meta name="description" content="PT Aloma Jaya Sejahtera bergerak di bidang produksi dan manufaktur baterai berkualitas tinggi untuk berbagai kebutuhan industri dan komersial.">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}
:root{
--black:#0b0b0b;
--gold:#d4af37;
--dark:#141414;
--white:#ffffff;
--gray:#bdbdbd;
}
body{
background:var(--black);
color:var(--white);
overflow-x:hidden;
}
.container{
width:90%;
max-width:1200px;
margin:auto;
}
header{
position:fixed;
width:100%;
top:0;
left:0;
z-index:999;
background:rgba(0,0,0,.85);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(212,175,55,.2);
}
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 0;
}
.logo{
font-size:26px;
font-weight:800;
color:var(--gold);
}
nav ul{
display:flex;
list-style:none;
gap:30px;
}
nav ul li a{
color:white;
text-decoration:none;
font-weight:500;
transition:.3s;
}
nav ul li a:hover{
color:var(--gold);
}
.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1800&q=80');
background-size:cover;
background-position:center;
}
.hero h1{
font-size:60px;
font-weight:800;
margin-bottom:20px;
}
.hero h1 span{
color:var(--gold);
}
.hero p{
max-width:800px;
margin:auto;
font-size:18px;
color:#ddd;
line-height:1.8;
}
.hero-btn{
display:inline-block;
margin-top:30px;
padding:14px 35px;
background:var(--gold);
color:black;
font-weight:700;
text-decoration:none;
border-radius:50px;
}
section{
padding:100px 0;
}
.section-title{
text-align:center;
margin-bottom:60px;
}
.section-title h2{
font-size:40px;
color:var(--gold);
margin-bottom:15px;
}
.section-title p{
color:var(--gray);
}
.about{
background:#111;
}
.about-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:50px;
align-items:center;
}
.about-img{
height:450px;
background:#1c1c1c;
border:2px dashed var(--gold);
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
color:var(--gold);
font-size:20px;
}
.about-content h3{
font-size:32px;
margin-bottom:20px;
}
.about-content p{
color:#ccc;
line-height:1.8;
margin-bottom:20px;
}
.vm-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:25px;
}
.vm-card{
background:#1a1a1a;
padding:25px;
border-radius:15px;
border-left:4px solid var(--gold);
}
.vm-card h4{
color:var(--gold);
margin-bottom:10px;
}
.products{
background:#0f0f0f;
}
.product-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}
.product-card{
background:#181818;
padding:30px;
border-radius:20px;
border:1px solid rgba(212,175,55,.2);
transition:.3s;
}
.product-card:hover{
transform:translateY(-8px);
border-color:var(--gold);
}
.product-card h3{
color:var(--gold);
margin-bottom:15px;
}
.product-card p{
color:#ccc;
line-height:1.7;
}
.features{
background:#111;
}
